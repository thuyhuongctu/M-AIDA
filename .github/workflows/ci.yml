name: CI

on:
  push:
    branches: [main, v8-cloud, 'dev/**', 'fix/**', 'feat/**', 'chore/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r validation/requirements.txt pytest ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check backend demo validation --select E9,F
      - name: Unit tests
        working-directory: backend
        run: pytest tests -q
      - name: Defense App smoke test
        run: python demo/smoke_test.py
      - name: Independent-validation analysis tests
        run: python -m pytest validation/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build

  images:
    # The VPS builds these images itself (docker-compose.cloud.yml); building
    # them here first means a broken Dockerfile shows up in CI, not on the server.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: maida-${{ matrix.service }}:ci
          load: true
      - name: Backend image starts and answers /api/health
        if: matrix.service == 'backend'
        run: |
          docker run -d --name maida -p 8765:8765 maida-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs maida
          exit 1
