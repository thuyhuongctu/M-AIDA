server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA - all routes served from index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Background music (8.0): two MP3s that never change under the same name.
    # A missing file is a 404, not the SPA page.
    location /audio/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy API calls to backend container
    location /api/ {
        proxy_pass http://backend:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
