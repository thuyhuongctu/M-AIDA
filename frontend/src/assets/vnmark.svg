<!-- Line map of Vietnam with the Paracel (Hoang Sa) and Spratly (Truong Sa) archipelagos, used as the page watermark.
     From the 7.x M-AIDA site; the flag marks the northern tip, the star marks Can Tho, the lighthouses blink. -->
<svg viewBox="-12 -46 604 650" xmlns="http://www.w3.org/2000/svg" overflow="visible" role="img" aria-label="Vietnam, with the Paracel and Spratly archipelagos">
<style>
  :root { color: #c4b8a1; }
  .lh-halo { opacity: 0; }
  .lh-light { animation: lhblink 1.8s ease-in-out infinite; }
  .lh-halo { animation: lhhalo 1.8s ease-in-out infinite; }
  .lh:nth-of-type(2) .lh-light, .lh:nth-of-type(2) .lh-halo { animation-delay: .45s; }
  .lh:nth-of-type(3) .lh-light, .lh:nth-of-type(3) .lh-halo { animation-delay: .9s; }
  .lh:nth-of-type(4) .lh-light, .lh:nth-of-type(4) .lh-halo { animation-delay: 1.35s; }
  @keyframes lhblink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes lhhalo { 0%,100% { opacity: 0; } 50% { opacity: .7; } }
  @media (prefers-reduced-motion: reduce) { .lh-light, .lh-halo { animation: none; } .lh-halo { opacity: .35; } }
</style>

