# Alembic configuration for the M-AIDA backend. The script location and the
# database URL are set programmatically (db.init_schema) so the same files
# serve SQLite and Postgres; `alembic` on the command line also works from
# this directory for hand-written migrations:
#     DATABASE_URL=... .venv/bin/alembic revision -m "..."
[alembic]
path_separator = os
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
